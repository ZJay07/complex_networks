name: Run Network Visualizer

on:
  workflow_dispatch: # Trigger manually from the GitHub Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Script
      run: python network_visualizer.py

    - name: Upload All Image Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: cascade-plots
        path: '*.png' # Match all PNG files generated in the root directory

